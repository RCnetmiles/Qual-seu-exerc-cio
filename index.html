<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genetics RPG Simulator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root {
            --bg-color: #f0f0f0;
            --screen-bg: #e0f8cf; /* Cor estilo Gameboy */
            --dark-color: #2b2b2b;
            --border-color: #4a4a4a;
            --primary-btn: #3d6cb9;
            --accent: #d32f2f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'VT323', monospace; /* Fonte Pixelada */
            background-color: var(--dark-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--dark-color);
            font-size: 20px;
        }

        /* Container Principal (O "Device") */
        .device-container {
            width: 100%;
            max-width: 800px;
            background-color: #dcdcdc;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 4px solid #999;
        }

        /* Tela do Sistema */
        .screen {
            background-color: var(--screen-bg);
            border: 4px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            min-height: 500px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        /* --- TELA DE QR CODE --- */
        #qr-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .scanner-box {
            width: 250px;
            height: 250px;
            border: 4px dashed var(--dark-color);
            margin: 20px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.05);
        }

        .scan-line {
            width: 100%;
            height: 4px;
            background-color: var(--accent);
            position: absolute;
            animation: scan 2s infinite linear;
            display: none;
        }

        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        /* --- INTERFACE DE ENTREVISTA --- */
        #game-screen {
            display: none; /* Oculto inicialmente */
            flex-direction: column;
            height: 100%;
        }

        /* Barra de Status */
        .status-bar {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Caixa de Diálogo (Estilo Pokémon) */
        .dialog-box {
            background-color: white;
            border: 4px double var(--dark-color);
            border-radius: 5px;
            padding: 15px;
            height: 120px; /* Altura fixa para não pular */
            margin-bottom: 15px;
            position: relative;
            font-size: 1.2rem;
            line-height: 1.4;
            overflow: hidden;
        }

        .dialog-arrow {
            position: absolute;
            bottom: 10px;
            right: 15px;
            width: 0; 
            height: 0; 
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid var(--accent);
            animation: bounce 0.8s infinite;
            display: none; /* Só aparece quando termina de digitar */
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(5px); }
        }

        /* Área de Decisão (Botões) */
        .choice-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .btn-choice {
            background-color: white;
            border: 2px solid var(--dark-color);
            padding: 15px;
            border-radius: 8px;
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            cursor: pointer;
            text-align: left;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
        }

        .btn-choice:hover {
            background-color: #f0f0f0;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px rgba(0,0,0,0.2);
        }

        .btn-choice:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px;
        }

        .btn-choice:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Caderneta (Log) */
        .notebook {
            flex-grow: 1;
            background: #fff;
            border: 2px solid var(--border-color);
            padding: 10px;
            overflow-y: auto;
            font-size: 0.9rem;
            max-height: 150px;
            margin-bottom: 15px;
        }
        
        .log-item {
            border-bottom: 1px dashed #ccc;
            padding: 4px 0;
        }

        /* Área de Diagnóstico */
        .diagnosis-area {
            display: flex;
            gap: 10px;
            border-top: 2px solid var(--border-color);
            padding-top: 15px;
        }

        select {
            flex-grow: 1;
            padding: 8px;
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            border: 2px solid var(--dark-color);
        }

        .btn-action {
            background-color: var(--primary-btn);
            color: white;
            border: 2px solid var(--dark-color);
            padding: 8px 20px;
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 2px 2px 0 #000;
        }

        .btn-hint {
            background-color: #ffb700;
            color: black;
            margin-bottom: 5px;
            width: 100%;
        }

        /* Botão genérico */
        .btn-start {
            font-size: 1.5rem;
            padding: 10px 30px;
            margin-top: 20px;
        }

        /* Feedback Overlay */
        #feedback-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            color: white;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 100;
        }
    </style>
</head>
<body>

<div class="device-container">
    <div class="screen">
        
        <div id="qr-screen">
            <h2>🔐 ACESSO RESTRITO</h2>
            <p>Para iniciar o Caso <span id="qr-case-num">1</span>, escaneie o código do paciente.</p>
            
            <div class="scanner-box" id="scanner-box">
                <div class="scan-line" id="scan-line"></div>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=GENETICA-CASO-1" alt="QR Code Placeholder" style="opacity: 0.2;">
            </div>

            <button class="btn-action btn-start" onclick="simulateScan()">📷 ESCANEAR QR CODE</button>
            <p style="font-size: 0.8rem; margin-top: 10px;">(Simulação: Clique para ler o código)</p>
        </div>

        <div id="game-screen">
            <div class="status-bar">
                <span id="case-display">CASO: 1/5</span>
                <span id="questions-left">PERGUNTAS: 0/10</span>
            </div>

            <div class="dialog-box" id="dialog-box">
                <span id="typewriter-text">Inicializando sistema...</span>
                <div class="dialog-arrow" id="dialog-arrow"></div>
            </div>

            <div class="choice-area" id="choice-area">
                <button class="btn-choice" id="choice-a" onclick="handleChoice('A')">Opção A</button>
                <button class="btn-choice" id="choice-b" onclick="handleChoice('B')">Opção B</button>
            </div>
            
            <button class="btn-action btn-hint" id="hint-btn" onclick="showHint()">💡 PEDIR DICA (0/3)</button>

            <div class="notebook" id="notebook">
                <strong>📝 HISTÓRICO:</strong>
                <div id="log-content"></div>
            </div>

            <div class="diagnosis-area">
                <select id="diagnosis-select">
                    <option value="">-- SELECIONE O DIAGNÓSTICO --</option>
                    <option value="Autossômica Dominante">Autossômica Dominante</option>
                    <option value="Autossômica Recessiva">Autossômica Recessiva</option>
                    <option value="Ligada ao X Dominante">Ligada ao X Dominante</option>
                    <option value="Ligada ao X Recessiva">Ligada ao X Recessiva</option>
                    <option value="Mitocondrial">Mitocondrial</option>
                </select>
                <button class="btn-action" onclick="submitDiagnosis()">ENVIAR</button>
            </div>
        </div>

        <div id="feedback-overlay">
            <h1 id="feedback-title">RESULTADO</h1>
            <p id="feedback-msg">Mensagem...</p>
            <button class="btn-action btn-start" id="next-level-btn" onclick="nextLevel()">PRÓXIMO CASO ➔</button>
        </div>

    </div>
</div>

<script>
    // --- DADOS DOS CASOS ---
    const cases = [
        {
            id: 1,
            qrCode: "GENE-01",
            intro: "Paciente: João, 35 anos. 'Doutor, notei que meus dedos são diferentes e meus filhos também têm isso.'",
            inheritance: "Autossômica Dominante",
            explanation: "AD: Transmissão vertical (pais e filhos afetados). Afeta ambos os sexos. Basta um alelo para manifestar.",
            data: {
                "pais": "Minha mãe tem a mesma condição que eu. Meu pai não tem nada.",
                "irmaos": "Tenho uma irmã que também tem. Meu irmão caçula nasceu sem nada.",
                "filhos": "Tenho dois filhos com isso e uma filha sem.",
                "transmissao": "Parece que vem vindo de geração em geração. Minha avó também tinha.",
                "sexo": "Não vejo diferença, homens e mulheres na família têm.",
                "consanguinidade": "Não, meus pais não são parentes.",
                "filhas_pai": "Não sei dizer sobre essa regra específica.",
                "gravidade": "É só físico (polidactilia), vivemos bem."
            },
            hints: ["Transmissão Vertical (todas as gerações).", "Afeta homens e mulheres igualmente.", "Um pai afetado tem 50% de chance de passar."]
        },
        {
            id: 2,
            qrCode: "GENE-02",
            intro: "Paciente: Maria, 28 anos. 'Ninguém na minha família tinha isso antes de mim e do meu irmão.'",
            inheritance: "Autossômica Recessiva",
            explanation: "AR: Salta gerações (pais portadores sadios). Consanguinidade aumenta o risco.",
            data: {
                "pais": "Meus pais são saudáveis, graças a Deus. Nenhum deles tem isso.",
                "irmaos": "Meu irmão também tem a doença. Minha irmã é saudável.",
                "filhos": "Ainda não tenho filhos.",
                "transmissao": "Saltou a geração dos meus pais. Meus avós também não tinham.",
                "sexo": "Afetou eu (mulher) e meu irmão (homem).",
                "consanguinidade": "Meus pais são primos de segundo grau.",
                "filhas_pai": "Não se aplica, meus pais não são afetados.",
                "gravidade": "É uma condição metabólica séria (Fibrose Cística)."
            },
            hints: ["Pais não afetados (Portadores).", "Salta gerações (Transmissão Horizontal).", "Consanguinidade é um fator de risco."]
        },
        {
            id: 3,
            qrCode: "GENE-03",
            intro: "Paciente: Pedro, 12 anos. 'Eu sangro muito quando me machuco. Meu tio também.'",
            inheritance: "Ligada ao X Recessiva",
            explanation: "XR: Afeta mais homens. Mães portadoras transmitem para filhos. Pai nunca passa para filho homem.",
            data: {
                "pais": "Meu pai é normal. Minha mãe também, mas dizem que ela carrega o gene.",
                "irmaos": "Meus irmãos estão bem. Só eu tenho.",
                "filhos": "Sou criança ainda!",
                "transmissao": "Meu avô materno tinha. Pulou minha mãe e veio pra mim.",
                "sexo": "Só vi homens com isso na minha família.",
                "consanguinidade": "Não.",
                "filhas_pai": "Meu avô (afetado) teve minha mãe (saudável, mas portadora).",
                "gravidade": "É hemofilia."
            },
            hints: ["Afeta principalmente homens.", "Mãe portadora transmite para filho.", "Pai afetado NÃO transmite para filho homem."]
        },
        {
            id: 4,
            qrCode: "GENE-04",
            intro: "Paciente: Ana, 40 anos. 'Eu e todos os meus irmãos temos esse problema de energia.'",
            inheritance: "Mitocondrial",
            explanation: "Mitocondrial: Apenas a mãe transmite. Se a mãe tem, TODOS os filhos têm.",
            data: {
                "pais": "Minha mãe tem a doença. Meu pai é saudável.",
                "irmaos": "Todos nós (3 homens e 3 mulheres) temos a doença.",
                "filhos": "Todos os meus filhos nasceram com isso também.",
                "transmissao": "Vem tudo da minha mãe.",
                "sexo": "Afeta todo mundo, mas só as mulheres passam pros filhos.",
                "consanguinidade": "Não.",
                "filhas_pai": "Meu irmão (afetado) teve filhos saudáveis. Ele não passou.",
                "gravidade": "É uma miopatia."
            },
            hints: ["Transmissão Materna Exclusiva.", "Mãe afetada passa para 100% dos filhos.", "Pai afetado não transmite nada."]
        },
        {
            id: 5,
            qrCode: "GENE-05",
            intro: "Paciente: Sofia, 8 anos. 'Minha mãe tem, minha avó tem... parece coisa de mulher.'",
            inheritance: "Ligada ao X Dominante",
            explanation: "XD: Pai afetado transmite para TODAS as filhas e NENHUM filho. Afeta mais mulheres.",
            data: {
                "pais": "Minha mãe é afetada. Meu pai é saudável.",
                "irmaos": "Minha irmã tem. Meu irmão nasceu saudável.",
                "filhos": "Sou criança.",
                "transmissao": "Minha avó tinha, passou pra minha mãe, que passou pra mim.",
                "sexo": "Tem muito mais mulher com isso na família.",
                "consanguinidade": "Não.",
                "filhas_pai": "Se meu pai tivesse, todas nós filhas teríamos obrigatóriamente.",
                "gravidade": "Síndrome de Rett (letal em homens homozigotos)."
            },
            hints: ["Afeta mais mulheres.", "Pai afetado transmite para TODAS as filhas.", "Transmissão vertical."]
        }
    ];

    // Banco de Perguntas
    const questionPool = [
        { id: "pais", text: "Como são seus pais?" },
        { id: "irmaos", text: "Você tem irmãos afetados?" },
        { id: "filhos", text: "Você tem filhos afetados?" },
        { id: "transmissao", text: "Como é a transmissão nas gerações?" },
        { id: "sexo", text: "Afeta mais homens ou mulheres?" },
        { id: "consanguinidade", text: "Há parentesco entre seus pais?" },
        { id: "filhas_pai", text: "Como é a transmissão do pai?" },
        { id: "gravidade", text: "Qual a gravidade/tipo da doença?" }
    ];

    // --- ESTADO DO JOGO ---
    let currentLevel = 0;
    let usedQuestions = 0;
    let askedQuestionIds = [];
    let currentChoices = []; // Guarda as 2 perguntas atuais
    let hintCount = 0;

    // Elementos DOM
    const qrScreen = document.getElementById('qr-screen');
    const gameScreen = document.getElementById('game-screen');
    const dialogBox = document.getElementById('typewriter-text');
    const dialogArrow = document.getElementById('dialog-arrow');
    const choiceBtnA = document.getElementById('choice-a');
    const choiceBtnB = document.getElementById('choice-b');
    const logContent = document.getElementById('log-content');
    const scanLine = document.getElementById('scan-line');
    const feedbackOverlay = document.getElementById('feedback-overlay');
    const btnHint = document.getElementById('hint-btn');

    // --- FUNÇÕES DE QR CODE ---
    function updateQRScreen() {
        document.getElementById('qr-case-num').innerText = currentLevel + 1;
        scanLine.style.display = 'none';
    }

    function simulateScan() {
        scanLine.style.display = 'block';
        setTimeout(() => {
            // Sucesso no scan
            qrScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            startGame();
        }, 2000); // 2 segundos de "leitura"
    }

    // --- ENGINE DE TEXTO (Typewriter) ---
    let typingTimer;
    function typeText(text, callback) {
        dialogBox.innerHTML = "";
        dialogArrow.style.display = "none";
        let i = 0;
        
        // Cancelar digitação anterior se houver
        if (typingTimer) clearInterval(typingTimer);

        typingTimer = setInterval(() => {
            dialogBox.innerHTML += text.charAt(i);
            i++;
            if (i >= text.length) {
                clearInterval(typingTimer);
                dialogArrow.style.display = "block"; // Mostrar seta de fim
                if (callback) callback();
            }
        }, 25); // Velocidade da digitação
    }

    // --- LÓGICA DO JOGO ---
    function startGame() {
        // Resetar Variáveis
        usedQuestions = 0;
        askedQuestionIds = [];
        hintCount = 0;
        logContent.innerHTML = "";
        document.getElementById('case-display').innerText = `CASO: ${currentLevel + 1}/5`;
        document.getElementById('questions-left').innerText = `PERGUNTAS: 0/10`;
        document.getElementById('diagnosis-select').value = "";
        btnHint.innerText = "💡 PEDIR DICA (0/3)";
        btnHint.disabled = false;

        // Intro
        const introText = cases[currentLevel].intro;
        typeText(introText, () => {
            generateChoices();
        });
    }

    function generateChoices() {
        if (usedQuestions >= 10) {
            typeText("Você atingiu o limite de perguntas. Tente diagnosticar ou peça uma dica.");
            choiceBtnA.style.display = 'none';
            choiceBtnB.style.display = 'none';
            return;
        }

        // Filtrar perguntas que ainda não foram feitas
        const available = questionPool.filter(q => !askedQuestionIds.includes(q.id));
        
        if (available.length < 2) {
            // Caso raro onde acabam as perguntas
            typeText("Não tenho mais informações para dar.");
            choiceBtnA.style.display = 'none';
            choiceBtnB.style.display = 'none';
            return;
        }

        // Escolher 2 aleatórias
        const shuffled = available.sort(() => 0.5 - Math.random());
        currentChoices = [shuffled[0], shuffled[1]];

        // Mostrar botões
        choiceBtnA.style.display = 'block';
        choiceBtnB.style.display = 'block';
        choiceBtnA.innerText = "➤ " + currentChoices[0].text;
        choiceBtnB.innerText = "➤ " + currentChoices[1].text;
        choiceBtnA.disabled = false;
        choiceBtnB.disabled = false;
    }

    function handleChoice(option) {
        // Desabilitar botões enquanto digita
        choiceBtnA.disabled = true;
        choiceBtnB.disabled = true;

        const selectedQ = option === 'A' ? currentChoices[0] : currentChoices[1];
        
        // Registrar uso
        askedQuestionIds.push(selectedQ.id);
        usedQuestions++;
        document.getElementById('questions-left').innerText = `PERGUNTAS: ${usedQuestions}/10`;

        // Obter resposta
        const caseData = cases[currentLevel].data;
        const answer = caseData[selectedQ.id];

        // Adicionar ao Log
        const logEntry = document.createElement('div');
        logEntry.className = 'log-item';
        logEntry.innerHTML = `<strong>P:</strong> ${selectedQ.text}<br><strong>R:</strong> ${answer}`;
        logContent.appendChild(logEntry);
        logContent.scrollTop = logContent.scrollHeight;

        // Tocar animação de resposta
        typeText(answer, () => {
            // Após terminar de digitar, gerar novas escolhas
            setTimeout(generateChoices, 500); 
        });
    }

    function showHint() {
        if (hintCount >= 3) {
            typeText("Não há mais dicas disponíveis.");
            return;
        }

        const hint = cases[currentLevel].hints[hintCount];
        hintCount++;
        btnHint.innerText = `💡 PEDIR DICA (${hintCount}/3)`;
        
        // Adicionar ao log em destaque
        const logEntry = document.createElement('div');
        logEntry.className = 'log-item';
        logEntry.style.backgroundColor = "#fff3cd";
        logEntry.innerHTML = `<strong>💡 DICA:</strong> ${hint}`;
        logContent.appendChild(logEntry);
        logContent.scrollTop = logContent.scrollHeight;

        typeText(`DICA REVELADA: ${hint}`);
    }

    function submitDiagnosis() {
        const selected = document.getElementById('diagnosis-select').value;
        const correct = cases[currentLevel].inheritance;
        
        feedbackOverlay.style.display = 'flex';
        
        if (selected === correct) {
            document.getElementById('feedback-title').innerText = "✅ SUCESSO!";
            document.getElementById('feedback-title').style.color = "#4eff4e";
            document.getElementById('feedback-msg').innerHTML = `Diagnóstico Correto!<br><br>${cases[currentLevel].explanation}`;
            document.getElementById('next-level-btn').innerText = "PRÓXIMO CASO ➔";
            document.getElementById('next-level-btn').onclick = nextLevel;
        } else {
            document.getElementById('feedback-title').innerText = "❌ ERRO";
            document.getElementById('feedback-title').style.color = "#ff4e4e";
            document.getElementById('feedback-msg').innerText = `Diagnóstico Incorreto. Você escolheu ${selected}. Analise o log e tente novamente.`;
            document.getElementById('next-level-btn').innerText = "TENTAR NOVAMENTE";
            document.getElementById('next-level-btn').onclick = closeFeedback;
        }
    }

    function closeFeedback() {
        feedbackOverlay.style.display = 'none';
    }

    function nextLevel() {
        feedbackOverlay.style.display = 'none';
        currentLevel++;
        if (currentLevel >= cases.length) {
            alert("PARABÉNS! Você completou todos os casos clínicos.");
            currentLevel = 0;
        }
        
        // Voltar para tela de QR
        gameScreen.style.display = 'none';
        qrScreen.style.display = 'flex';
        updateQRScreen();
    }

    // Inicialização
    updateQRScreen();

</script>

</body>
</html>
